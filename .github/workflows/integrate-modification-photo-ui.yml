name: Integrate modification photo UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run integration script
        run: python scripts/integrate-modification-photos.py

      - name: Commit page integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/profile/cars/[id]/page.tsx'
          if git diff --cached --quiet; then
            echo "No page changes needed."
            exit 0
          fi
          git commit -m "feat: integrate modification photo upload UI"
          git push
